[package]
name = "phasit-imread"
version = "0.1.0"
edition = "2021"
# The MSRV this crate builds on: `as_chunks` (Rust 1.88) is the newest API it
# uses, and no dependency of its graph declares a higher one - the highest is
# `ruzstd 0.9.1` at 1.87, in the runtime graph.
rust-version = "1.88"
description = "Native Rust reader for microscopy image formats (TIFF/OME-TIFF, LSM, LIF, CZI, ND2, MRC2014, DeltaVision, ICS/IDS, MetaMorph STK, N5) — offline, in-process."
license = "Apache-2.0"   # see LICENSE and NOTICE in this crate
authors = ["Eclose"]
repository = "https://github.com/Aspis0/phaseit-readers"
homepage = "https://github.com/Aspis0/phaseit-readers"
readme = "README.md"

[dependencies]
tiff = "0.11"
quick-xml = "0.42"
memmap2 = "0.9"
byteorder = "1"
thiserror = "2"
ruzstd = "0.9"       # pure-Rust zstd decoder (MIT); CZI Zstd0/Zstd1 subblocks. NO C `zstd` crate.
serde_json = "1"     # N5 `attributes.json` (MIT/Apache-2.0); already a dev-dependency, now a normal one.
flate2 = "1"         # zlib inflate for ND2 CLxLiteVariant COMPRESS metadata; pure-Rust miniz_oxide backend (default), NO C zlib-sys.
ndarray = { version = "0.17", optional = true }   # OPTIONAL (feature-gated)

[dev-dependencies]
# dev-only, for the parity tests. `default-features = false` drops ndarray-npy's
# .npz reader - the only edge that pulled `zip` (and its advisories) into the graph.
ndarray-npy = { version = "0.10", default-features = false }
serde_json = "1"        # also a runtime dependency (N5 attributes); the ND2 and CZI parity manifests parse with it

[build-dependencies]
# Only used when the `jpegxr` feature is on (compiles vendored jxrlib).
cc = "1"

[features]
default = []
ndarray = ["dep:ndarray"]
# jpegxr: CZI JpegXR-compressed subblocks. OPT-IN — requires a C toolchain to
# build the vendored jxrlib (vendor/jxrlib/, BSD). This crate alone builds
# pure-Rust by default; the workspace's apps (phasit-planed, src-tauri) enable
# the feature, so building the workspace needs a C toolchain.
jpegxr = []
# CZI Zstd0/Zstd1 use the pure-Rust `ruzstd` (always on); no C `zstd` feature.

[[bin]]
name = "imread"
path = "src/bin/imread.rs"
