[package]
name = "phasit-imread"
version = "0.1.0"
edition = "2021"
description = "Native Rust reader for proprietary microscopy image formats (TIFF/OME-TIFF, LSM, LIF, CZI, ND2) — offline, in-process."
license = "Apache-2.0"   # see LICENSE and NOTICE in this crate
authors = ["Eclose"]
repository = "https://github.com/Aspis0/phaseit-readers"
homepage = "https://github.com/Aspis0/phaseit-readers"
readme = "README.md"

[dependencies]
tiff = "0.11"
quick-xml = "0.41"
memmap2 = "0.9"
byteorder = "1"
thiserror = "2"
ruzstd = "0.8"       # pure-Rust zstd decoder (MIT); CZI Zstd0/Zstd1 subblocks. NO C `zstd` crate.
flate2 = "1"         # zlib inflate for ND2 CLxLiteVariant COMPRESS metadata; pure-Rust miniz_oxide backend (default), NO C zlib-sys.
ndarray = { version = "0.17", optional = true }   # OPTIONAL (feature-gated)

[dev-dependencies]
ndarray-npy = "0.10"   # dev-only, for the parity tests
serde_json = "1"        # dev-only: parse ND2 parity manifest_real.json

[build-dependencies]
cc = "1"   # only used when the `jpegxr` feature is on (compiles vendored jxrlib)

[features]
default = []
ndarray = ["dep:ndarray"]
# jpegxr: CZI JpegXR-compressed subblocks. OPT-IN — requires a C toolchain to
# build the vendored jxrlib (vendor/jxrlib/, BSD). A plain build stays pure-Rust.
jpegxr = []
# CZI Zstd0/Zstd1 use the pure-Rust `ruzstd` (always on); no C `zstd` feature.

[[bin]]
name = "imread"
path = "src/bin/imread.rs"
